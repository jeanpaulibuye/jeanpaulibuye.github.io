<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Likelemba Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#241b36;--muted:#6f6585;--main:#6b3fa0;--main2:#f5b82e;--ok:#2e9e5b;--bad:#d64545;--line:#e6dff2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--main);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}
header small{opacity:.85}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}
h3{margin:14px 0 8px;font-size:15px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--main);color:#fff}
button.sec{background:#ece6f6;color:var(--main)}
button.gold{background:var(--main2);color:#2b2100}
button.small{padding:8px 12px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>button{flex:none}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:#dcf3e5;color:var(--ok)}
.pill.bad{background:#fbe1e1;color:var(--bad)}
.pill.cur{background:#fff1cc;color:#8a6200}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.bar{height:10px;background:#ece6f6;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.notice{background:#fff7e0;border:1px solid #f1dc9b;border-radius:10px;padding:10px;font-size:13px;margin-bottom:14px}
.back{background:none;color:var(--main);padding:0;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <div><h1>🪙 Likelemba Pi</h1><small>La tontine numérique</small></div>
  <div id="who" class="muted" style="color:#fff"></div>
</header>
<main id="app"></main>

<script>
// ====== Réglages ======
// Passez à true quand le serveur d'approbation des paiements Pi sera en place.
var PI_PAYMENTS_LIVE = false;
var KEY = "likelemba_pi_v1";

// ====== Données ======
var state = load();
function load(){
  try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tontines) return s; } catch(e){}
  return { user: "", tontines: [] };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function find(id){ return state.tontines.filter(function(t){ return t.id === id; })[0]; }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function fmt(n){ return (Math.round(n*100)/100).toString().replace(".", ","); }
function freqLabel(f){ return f === "semaine" ? "chaque semaine" : "chaque mois"; }
function nowStr(){ return new Date().toLocaleDateString("fr-FR"); }

// ====== Pi SDK ======
var piReady = false;
try { if (window.Pi) { Pi.init({ version: "2.0", sandbox: true }); piReady = true; } } catch(e){}

function piLogin(){
  if (!piReady) { alert("Pi Browser non détecté. Utilisez le mode démo avec un pseudo."); return; }
  Pi.authenticate(["username","payments"], function(){}).then(function(auth){
    state.user = auth.user.username; save(); render();
  }).catch(function(){ alert("Connexion Pi impossible. Utilisez le mode démo."); });
}
function demoLogin(){
  var v = document.getElementById("pseudo").value.trim();
  if (!v) return;
  state.user = v; save(); render();
}
function logout(){ state.user = ""; save(); render(); }

// ====== Paiement ======
function payPi(t, name){
  var done = function(){ markPaid(t, name); render(); };
  if (PI_PAYMENTS_LIVE && piReady) {
    Pi.createPayment({
      amount: t.amount,
      memo: "Cotisation " + t.name + " - tour " + (t.round+1),
      metadata: { tontineId: t.id, round: t.round, member: name }
    }, {
      onReadyForServerApproval: function(paymentId){ /* TODO: appeler votre serveur /approve */ },
      onReadyForServerCompletion: function(paymentId, txid){ /* TODO: appeler votre serveur /complete */ done(); },
      onCancel: function(){},
      onError: function(){ alert("Erreur de paiement."); }
    });
  } else {
    if (confirm("Mode démo : enregistrer la cotisation de " + name + " (" + fmt(t.amount) + " π) ?")) done();
  }
}
function markPaid(t, name){
  t.paid[t.round] = t.paid[t.round] || {};
  t.paid[t.round][name] = nowStr();
  save();
}

// ====== Actions ======
var view = { page: "home", id: null };
function go(page, id){ view = { page: page, id: id || null }; render(); window.scrollTo(0,0); }

function createTontine(){
  var name = document.getElementById("tn").value.trim();
  var amount = parseFloat(String(document.getElementById("ta").value).replace(",", "."));
  var freq = document.getElementById("tf").value;
  if (!name || !(amount > 0)) { alert("Entrez un nom et un montant valide."); return; }
  var t = { id: uid(), name: name, amount: amount, freq: freq, owner: state.user,
            members: [state.user], order: [], started: false, round: 0, paid: {}, history: [] };
  state.tontines.push(t); save(); go("detail", t.id);
}
function addMember(id){
  var t = find(id); var inp = document.getElementById("nm");
  var n = inp.value.trim();
  if (!n) return;
  if (t.members.indexOf(n) >= 0) { alert("Ce membre existe déjà."); return; }
  if (t.members.length >= 12) { alert("12 membres maximum."); return; }
  t.members.push(n); save(); render();
}
function removeMember(id, n){
  var t = find(id);
  t.members = t.members.filter(function(m){ return m !== n; });
  save(); render();
}
function startTontine(id){
  var t = find(id);
  if (t.members.length < 2) { alert("Il faut au moins 2 membres."); return; }
  if (!confirm("Tirer l'ordre au sort et démarrer ? Les membres ne pourront plus changer.")) return;
  t.order = shuffle(t.members); t.started = true; t.round = 0; t.paid = {}; t.history = [];
  save(); render();
}
function payout(id){
  var t = find(id);
  var ben = t.order[t.round];
  t.history.push({ round: t.round + 1, who: ben, amount: t.amount * t.members.length, date: nowStr() });
  t.round += 1; save(); render();
}
function deleteTontine(id){
  if (!confirm("Supprimer cette tontine ?")) return;
  state.tontines = state.tontines.filter(function(t){ return t.id !== id; });
  save(); go("home");
}
function shareText(t){
  return "Rejoins ma tontine « " + t.name + " » sur Likelemba Pi : " + fmt(t.amount) + " π " + freqLabel(t.freq) + ", " + t.members.length + " membres.";
}
function share(id){
  var t = find(id); var txt = shareText(t);
  if (navigator.share) { navigator.share({ text: txt }).catch(function(){}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(function(){ alert("Message copié."); }); }
  else { prompt("Copiez ce message :", txt); }
}

// ====== Vues ======
function render(){
  var app = document.getElementById("app");
  document.getElementById("who").innerHTML = state.user ? esc(state.user) + ' · <a href="#" onclick="logout();return false" style="color:#fff">Quitter</a>' : "";
  if (!state.user) { app.innerHTML = vLogin(); return; }
  if (view.page === "new") app.innerHTML = vNew();
  else if (view.page === "detail" && find(view.id)) app.innerHTML = vDetail(find(view.id));
  else { view = { page: "home", id: null }; app.innerHTML = vHome(); }
}

function vLogin(){
  return '<div class="card"><h2>Bienvenue 👋</h2>' +
    '<p class="muted">Épargnez en groupe avec transparence : chacun cotise, chacun reçoit à son tour.</p>' +
    '<button onclick="piLogin()" style="width:100%">Se connecter avec Pi</button>' +
    '<h3>Ou mode démo</h3><label>Votre pseudo</label>' +
    '<input id="pseudo" placeholder="ex : Patrick" maxlength="30">' +
    '<div style="height:10px"></div><button class="sec" onclick="demoLogin()" style="width:100%">Continuer en démo</button></div>';
}

function vHome(){
  var h = '<div class="between" style="margin-bottom:12px"><h2 style="margin:0">Mes tontines</h2><button onclick="go(\'new\')">+ Nouvelle</button></div>';
  if (!PI_PAYMENTS_LIVE) h += '<div class="notice">Mode démo : les cotisations sont enregistrées dans l\'application, sans transfert réel de Pi.</div>';
  if (!state.tontines.length) return h + '<div class="card empty">Aucune tontine pour l\'instant.<br>Créez-en une pour commencer.</div>';
  state.tontines.forEach(function(t){
    var st = t.started ? (t.round >= t.order.length ? "Terminée" : "Tour " + (t.round+1) + "/" + t.order.length) : "En préparation";
    h += '<div class="card" onclick="go(\'detail\',\'' + t.id + '\')" style="cursor:pointer"><div class="between"><b>' + esc(t.name) + '</b><span class="pill cur">' + st + '</span></div>' +
         '<div class="muted">' + fmt(t.amount) + ' π ' + freqLabel(t.freq) + ' · ' + t.members.length + ' membre(s)</div></div>';
  });
  return h;
}

function vNew(){
  return '<button class="back" onclick="go(\'home\')">← Retour</button><div class="card"><h2>Nouvelle tontine</h2>' +
    '<label>Nom du groupe</label><input id="tn" placeholder="ex : Famille Mukendi" maxlength="40">' +
    '<label>Montant par cotisation (π)</label><input id="ta" type="number" inputmode="decimal" min="0" step="any" placeholder="ex : 5">' +
    '<label>Fréquence</label><select id="tf"><option value="semaine">Chaque semaine</option><option value="mois">Chaque mois</option></select>' +
    '<div style="height:14px"></div><button onclick="createTontine()" style="width:100%">Créer la tontine</button></div>';
}

function vDetail(t){
  var h = '<button class="back" onclick="go(\'home\')">← Retour</button>';
  h += '<div class="card"><div class="between"><h2 style="margin:0">' + esc(t.name) + '</h2></div>' +
       '<div class="muted">' + fmt(t.amount) + ' π ' + freqLabel(t.freq) + ' · cagnotte par tour : <b>' + fmt(t.amount * t.members.length) + ' π</b></div>' +
       '<div style="height:10px"></div><button class="sec small" onclick="share(\'' + t.id + '\')">📤 Inviter / partager</button></div>';

  if (!t.started) {
    h += '<div class="card"><h2>Membres (' + t.members.length + ')</h2>';
    t.members.forEach(function(m){
      h += '<div class="item between"><span>' + esc(m) + (m === t.owner ? ' <span class="muted">(organisateur)</span>' : '') + '</span>' +
           (m !== t.owner && state.user === t.owner ? '<button class="sec small" onclick="removeMember(\'' + t.id + '\',' + esc(JSON.stringify(m)).replace(/&quot;/g,"&quot;") + ')">Retirer</button>' : '') + '</div>';
    });
    if (state.user === t.owner) {
      h += '<label>Ajouter un membre (pseudo Pi)</label><div class="row"><input id="nm" placeholder="pseudo" maxlength="30"><button onclick="addMember(\'' + t.id + '\')">Ajouter</button></div>' +
           '<div style="height:14px"></div><button class="gold" style="width:100%" onclick="startTontine(\'' + t.id + '\')">🎲 Tirer l\'ordre et démarrer</button>';
    } else h += '<p class="muted">Seul l\'organisateur peut démarrer la tontine.</p>';
    h += '</div>';
  } else {
    var finished = t.round >= t.order.length;
    if (finished) {
      h += '<div class="card"><h2>🎉 Tontine terminée</h2><p class="muted">Tous les membres ont reçu la cagnotte.</p></div>';
    } else {
      var ben = t.order[t.round]; var paid = t.paid[t.round] || {};
      var count = t.members.filter(function(m){ return paid[m]; }).length;
      var pct = Math.round(count / t.members.length * 100);
      h += '<div class="card"><div class="muted">Tour ' + (t.round+1) + ' sur ' + t.order.length + '</div>' +
           '<h2>🎁 Bénéficiaire : ' + esc(ben) + '</h2>' +
           '<div class="bar"><div style="width:' + pct + '%"></div></div><div class="muted">' + count + '/' + t.members.length + ' cotisations reçues</div><div style="height:6px"></div>';
      t.members.forEach(function(m){
        var ok = paid[m];
        h += '<div class="item between"><span>' + esc(m) + '</span><span>' +
             (ok ? '<span class="pill ok">Payé ' + esc(ok) + '</span>' :
               '<span class="pill bad">En attente</span> <button class="small" onclick="payPi(find(\'' + t.id + '\'),' + esc(JSON.stringify(m)) + ')">Cotiser</button>') + '</span></div>';
      });
      h += '<div style="height:14px"></div><button class="gold" style="width:100%"' + (count < t.members.length || state.user !== t.owner ? ' disabled' : '') +
           ' onclick="payout(\'' + t.id + '\')">Verser ' + fmt(t.amount * t.members.length) + ' π à ' + esc(ben) + '</button>';
      if (state.user !== t.owner) h += '<p class="muted">Le versement est validé par l\'organisateur quand tout le monde a cotisé.</p>';
      h += '</div>';
    }
    h += '<div class="card"><h2>Ordre de passage</h2>';
    t.order.forEach(function(m, i){
      h += '<div class="item between"><span>' + (i+1) + '. ' + esc(m) + '</span>' +
           (i === t.round && !finished ? '<span class="pill cur">Tour en cours</span>' : (i < t.round ? '<span class="pill ok">Reçu</span>' : '')) + '</div>';
    });
    h += '</div>';
    h += '<div class="card"><h2>Historique</h2>';
    if (!t.history.length) h += '<p class="muted">Aucun versement pour le moment.</p>';
    t.history.slice().reverse().forEach(function(x){
      h += '<div class="item"><b>Tour ' + x.round + '</b> — ' + esc(x.who) + ' a reçu ' + fmt(x.amount) + ' π <span class="muted">(' + esc(x.date) + ')</span></div>';
    });
    h += '</div>';
  }
  if (state.user === t.owner) h += '<button class="sec" style="width:100%" onclick="deleteTontine(\'' + t.id + '\')">Supprimer la tontine</button>';
  return h;
}

render();
</script>
</body>
</html>
